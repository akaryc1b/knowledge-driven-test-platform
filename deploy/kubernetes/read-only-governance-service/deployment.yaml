{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "kdtp-read-only-governance",
    "namespace": "kdtp-system",
    "labels": {
      "app.kubernetes.io/name": "kdtp-read-only-governance",
      "app.kubernetes.io/component": "read-api"
    }
  },
  "spec": {
    "replicas": 2,
    "revisionHistoryLimit": 3,
    "minReadySeconds": 10,
    "progressDeadlineSeconds": 600,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxUnavailable": 0,
        "maxSurge": 1
      }
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "kdtp-read-only-governance",
        "app.kubernetes.io/component": "read-api"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "kdtp-read-only-governance",
          "app.kubernetes.io/component": "read-api"
        }
      },
      "spec": {
        "serviceAccountName": "kdtp-read-only-governance",
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 30,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "topologySpreadConstraints": [
          {
            "maxSkew": 1,
            "topologyKey": "kubernetes.io/hostname",
            "whenUnsatisfiable": "ScheduleAnyway",
            "labelSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "kdtp-read-only-governance",
                "app.kubernetes.io/component": "read-api"
              }
            }
          }
        ],
        "containers": [
          {
            "name": "read-only-governance",
            "image": "ghcr.io/akaryc1b/knowledge-driven-test-platform/read-only-governance-service@sha256:9ea3d4ac1ece9aa3d47c658a0781e15ce9eafdfc56a20eb041251298b465ab13",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080,
                "protocol": "TCP"
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "kdtp-read-only-governance-config"
                }
              },
              {
                "secretRef": {
                  "name": "kdtp-read-only-governance-secrets"
                }
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/live",
                "port": "http",
                "scheme": "HTTP"
              },
              "periodSeconds": 2,
              "timeoutSeconds": 1,
              "failureThreshold": 30
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/live",
                "port": "http",
                "scheme": "HTTP"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/ready",
                "port": "http",
                "scheme": "HTTP"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 3,
              "successThreshold": 1
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true,
              "capabilities": {
                "drop": ["ALL"]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          }
        ]
      }
    }
  }
}
