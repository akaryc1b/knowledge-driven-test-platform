name: m2-r0-main-ci-closure

on:
  pull_request:
    paths:
      - '.github/workflows/m2-r0-main-ci-closure.yml'
      - 'scripts/collect-m2-r0-main-ci-closure.js'
      - 'scripts/collect-m2-main-branch-ci-evidence.js'
      - 'releases/m2/production-promotion.json'
      - 'docs/releases/M2-RC1-r0-main-ci-closure.md'
      - 'apps/read-only-governance-service/test/m2-r0-main-ci-closure.test.js'

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect exact R0 main push CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KDTP_MAIN_CI_COLLECT_ATTEMPTS: '12'
          KDTP_MAIN_CI_COLLECT_DELAY_MS: '10000'
        run: node scripts/collect-m2-r0-main-ci-closure.js > /tmp/m2-r0-main-ci-closure.json
      - name: Upload exact R0 main push CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-r0-main-ci-closure-evidence
          path: /tmp/m2-r0-main-ci-closure.json
          if-no-files-found: error
          retention-days: 90
      - name: Require closure-grade evidence
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('/tmp/m2-r0-main-ci-closure.json', 'utf8'));
          if (evidence.promotionSourceSha !== 'edf09333d9be9ea6839b8cf4d18efed95cfba821') {
            throw new Error('R0 closure evidence source SHA is invalid');
          }
          if (evidence.run?.event !== 'push' || evidence.run?.headBranch !== 'main') {
            throw new Error('R0 closure evidence is not a main push run');
          }
          if (evidence.eligibleForClosure !== true) {
            throw new Error('R0 main push evidence is not eligible for blocker closure');
          }
          NODE
