name: m3-r1-k6-api-spec-compiler

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r1-k6-api-spec-compiler.yml'
      - 'packages/k6-api-adapter/**'
      - 'schemas/execution/k6-api/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mapping-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused M3-R1 mapping contract tests
        run: node --test packages/k6-api-adapter/test/mapping.test.js
      - name: Run full Node test suite
        run: npm test
      - name: Upload M3-R1 mapping contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-r1-k6-api-mapping-contract-evidence
          path: |
            schemas/execution/k6-api/schema-catalog.json
            schemas/execution/k6-api/v1/*.schema.json
          if-no-files-found: error
          retention-days: 90
