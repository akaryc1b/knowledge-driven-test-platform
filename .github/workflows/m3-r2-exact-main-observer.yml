name: m3-r2-exact-main-observer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m3-r2-exact-main-observer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  observe-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Observe exact main push workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: 9d584af244f203d9232cd6df6c35ca1346901e12
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const repository = process.env.GITHUB_REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const token = process.env.GITHUB_TOKEN;
          const apiBase = process.env.GITHUB_API_URL;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const required = [
            'validation',
            'm3-r2-p5-source-generation-acceptance',
            'm3-r2-p4-source-bundle-publication',
            'm3-r1-k6-api-spec-compiler',
            'm2-r2-rebaseline-portable-release-readiness',
            'm2-r3-final-release-closure',
            'm3-r0-execution-contract-foundation',
            'm3-r2-p3-source-artifact-validation',
            'm3-r2-k6-api-source-generation',
            'm2-r2a-external-evidence-intake',
          ];

          async function api(path) {
            const response = await fetch(`${apiBase}${path}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            return response.json();
          }

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          let selected = null;
          for (let attempt = 1; attempt <= 90; attempt += 1) {
            const data = await api(`/repos/${repository}/actions/runs?head_sha=${targetSha}&event=push&per_page=100`);
            const exact = data.workflow_runs.filter((run) =>
              run.head_sha === targetSha
              && run.head_branch === 'main'
              && run.event === 'push');
            const current = new Map();
            for (const name of required) {
              const run = exact.filter((candidate) => candidate.name === name)
                .sort((left, right) => right.id - left.id)[0];
              if (run) current.set(name, run);
            }
            const failed = [...current.entries()].find(([, run]) =>
              run.status === 'completed' && run.conclusion !== 'success');
            if (failed) {
              throw new Error(`Required push workflow ${failed[0]} concluded ${failed[1].conclusion}`);
            }
            if (current.size === required.length
                && [...current.values()].every((run) => run.status === 'completed')) {
              selected = current;
              break;
            }
            if (attempt < 90) await sleep(10_000);
          }
          if (!selected) {
            throw new Error('Timed out waiting for all exact-main push workflows');
          }

          const evidence = {
            schemaVersion: 'm3-r2-exact-main-observer/v1',
            observedAt: new Date().toISOString(),
            repository,
            target: {
              branch: 'main',
              mergeSha: targetSha,
              sourcePr: 46,
              sourceHeadSha: '4841ee7268b17fbf67bc0c5dcf2de8d11e4d8b6f',
              mergeMethod: 'merge',
            },
            permissions: {
              contents: 'read',
              actions: 'read',
            },
            runs: {},
            decision: {
              m3R2Accepted: true,
              postMergeExactMainVerified: true,
              sourceGenerationAcceptanceComplete: true,
              sourcePersisted: true,
              artifactPublished: true,
              remoteArtifactPublished: false,
              sourceExecuted: false,
              executionRuntimeStarted: false,
              k6Invoked: false,
              externalProcessExecuted: false,
              nextRequiredSlice: 'M3-R3',
              repositoryBlockers: [],
              m3R3Started: false,
            },
            safetyBoundary: {
              remoteArtifactPublished: false,
              sourceExecuted: false,
              executionRuntimeStarted: false,
              k6Invoked: false,
              xk6Invoked: false,
              playwrightInvoked: false,
              externalProcessExecuted: false,
              nodeVmUsed: false,
              evalUsed: false,
              dynamicImportUsed: false,
              targetNetworkAccessed: false,
              databaseAccessed: false,
              secretAccessed: false,
              filesystemCredentialAccessed: false,
              temporaryExecutionDirectoryCreated: false,
              containerStarted: false,
              kubernetesResourceCreated: false,
              workerAdded: false,
              queueAdded: false,
              schedulerAdded: false,
              runtimeResultCollected: false,
              allureImplemented: false,
            },
          };

          for (const name of required) {
            const run = selected.get(name);
            if (run.status !== 'completed'
                || run.conclusion !== 'success'
                || run.head_sha !== targetSha
                || run.head_branch !== 'main'
                || run.event !== 'push') {
              throw new Error(`Exact-main run verification failed for ${name}`);
            }

            const jobData = await api(`/repos/${repository}/actions/runs/${run.id}/jobs?per_page=100`);
            if (!Array.isArray(jobData.jobs) || jobData.jobs.length === 0) {
              throw new Error(`No jobs found for ${name}`);
            }
            const unsuccessful = jobData.jobs.find((job) =>
              job.status !== 'completed' || job.conclusion !== 'success');
            if (unsuccessful) {
              throw new Error(`Job ${name}/${unsuccessful.name} is ${unsuccessful.status}/${unsuccessful.conclusion}`);
            }
            const jobs = Object.fromEntries(jobData.jobs.map((job) => [job.name, {
              id: job.id,
              status: job.status,
              conclusion: job.conclusion,
            }]));

            const artifactData = await api(`/repos/${repository}/actions/runs/${run.id}/artifacts?per_page=100`);
            if (!Array.isArray(artifactData.artifacts) || artifactData.artifacts.length === 0) {
              throw new Error(`No permanent Artifacts found for ${name}`);
            }
            const artifacts = artifactData.artifacts.map((artifact) => ({
              id: artifact.id,
              name: artifact.name,
              digest: artifact.digest,
              sizeInBytes: artifact.size_in_bytes,
              expired: artifact.expired,
              createdAt: artifact.created_at,
              expiresAt: artifact.expires_at,
              boundHeadSha: artifact.workflow_run?.head_sha ?? null,
            }));
            if (artifacts.some((artifact) => artifact.expired)) {
              throw new Error(`Expired Artifact found for ${name}`);
            }
            if (artifacts.some((artifact) => artifact.boundHeadSha !== null
                && artifact.boundHeadSha !== targetSha)) {
              throw new Error(`Artifact Head binding mismatch for ${name}`);
            }

            evidence.runs[name] = {
              id: run.id,
              runNumber: run.run_number,
              workflowId: run.workflow_id,
              event: run.event,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              jobs,
              artifacts,
            };
          }

          const p5Artifacts = evidence.runs['m3-r2-p5-source-generation-acceptance'].artifacts;
          for (const requiredName of [
            'm3-r2-source-generation-p5-evidence',
            'm3-r2-source-generation-p5-postgres-log',
          ]) {
            const artifact = p5Artifacts.find((candidate) => candidate.name === requiredName);
            if (!artifact
                || artifact.expired
                || artifact.boundHeadSha !== targetSha
                || !/^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? '')) {
              throw new Error(`Exact-main P5 Artifact ${requiredName} is missing or invalid`);
            }
          }

          await writeFile('/tmp/m3-r2-exact-main-observer-evidence.json',
            `${JSON.stringify(evidence, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(evidence, null, 2));
          NODE
      - name: Upload exact-main observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-r2-exact-main-observer-evidence
          path: /tmp/m3-r2-exact-main-observer-evidence.json
          if-no-files-found: error
          retention-days: 90
