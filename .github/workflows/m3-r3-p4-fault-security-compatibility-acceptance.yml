name: m3-r3-p4-fault-security-compatibility-acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r3-p4-fault-security-compatibility-acceptance.yml'
      - 'package.json'
      - 'packages/k6-api-adapter/src/**'
      - 'packages/k6-api-adapter/test/**'
      - 'schemas/execution/k6-api-runtime/**'
      - 'scripts/validate-m3-r3-p4-fault-security-compatibility.js'
      - 'scripts/m3-r3-p4/**'
      - 'docs/02-development/m3-r3-p4-fault-security-compatibility-handoff.md'
      - 'docs/03-roadmap/m3-r3-p4-fault-security-compatibility-acceptance.md'
      - 'docs/04-governance/**m3-r3-p4**'
      - 'docs/05-adr/ADR-0034-linux-node22-node24-runtime-acceptance.md'
      - 'docs/06-security/m3-r3-p4-fault-security-compatibility-threat-model.md'
      - 'docs/releases/M3-R3-P4-fault-security-compatibility-acceptance.md'
      - 'docs/m3-r3-p4-index.md'
      - 'docs/README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-r3-p4-fault-security-compatibility-acceptance.yml'
      - 'package.json'
      - 'packages/k6-api-adapter/src/**'
      - 'packages/k6-api-adapter/test/**'
      - 'schemas/execution/k6-api-runtime/**'
      - 'scripts/validate-m3-r3-p4-fault-security-compatibility.js'
      - 'scripts/m3-r3-p4/**'
      - 'docs/02-development/m3-r3-p4-fault-security-compatibility-handoff.md'
      - 'docs/03-roadmap/m3-r3-p4-fault-security-compatibility-acceptance.md'
      - 'docs/04-governance/**m3-r3-p4**'
      - 'docs/05-adr/ADR-0034-linux-node22-node24-runtime-acceptance.md'
      - 'docs/06-security/m3-r3-p4-fault-security-compatibility-threat-model.md'
      - 'docs/releases/M3-R3-P4-fault-security-compatibility-acceptance.md'
      - 'docs/m3-r3-p4-index.md'
      - 'docs/README.md'

permissions:
  contents: read

env:
  M3_R3_P4_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-fault-security-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact Head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_P4_EXACT_HEAD"
          test -z "$(git status --porcelain)"
          echo "checkedOutExactHead=$M3_R3_P4_EXACT_HEAD"
      - name: Set up project baseline Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run Node.js 22 acceptance and predecessor Validators
        shell: bash
        run: bash scripts/m3-r3-p4/ci-node22.sh
      - name: Set up compatibility Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run fake-only Node.js 24 compatibility
        shell: bash
        run: bash scripts/m3-r3-p4/ci-node24.sh
      - name: Restore Node.js 22 for Evidence generation
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and audit exact-Head Evidence payload
        env:
          M3_R3_P4_BRANCH: ${{ github.head_ref || github.ref_name }}
          M3_R3_P4_EMIT_EVIDENCE: true
        run: node scripts/m3-r3-p4/ci-artifact.js
      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_P4_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - name: Upload permanent P4 Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-r3-p4-fault-security-compatibility-evidence
          path: /tmp/m3-r3-p4-artifact
          if-no-files-found: error
          retention-days: 90
