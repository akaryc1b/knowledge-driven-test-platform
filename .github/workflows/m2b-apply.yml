name: m2b-apply

on:
  push:
    branches:
      - agent/m2-b-capability-catalog

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-b-capability-catalog
          fetch-depth: 0
      - name: Apply verified offline implementation
        shell: bash
        run: |
          set -euo pipefail
          if test -f packages/test-capability/package.json; then
            echo "M2-B implementation already applied"
            exit 0
          fi
          cat .github/m2b-patch.part* > /tmp/m2b.patch.gz
          test "$(sha256sum /tmp/m2b.patch.gz | cut -d' ' -f1)" = "308c5f454e8e1999611fbbc0bdf973608dac2e250b852dee0ef75d4439344c5b"
          gzip -dc /tmp/m2b.patch.gz > /tmp/m2b.patch
          test "$(sha256sum /tmp/m2b.patch | cut -d' ' -f1)" = "5a75703f3bc3344a49a41b043489b2147c32ed0c3b6cba64d18fb2c7fb8c8fb3"
          git apply --check /tmp/m2b.patch
          git apply /tmp/m2b.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add versioned capability catalog"
          git push origin HEAD:agent/m2-b-capability-catalog
