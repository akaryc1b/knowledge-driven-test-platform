name: m3-r3-p3-sanitized-runtime-result

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r3-p3-sanitized-runtime-result.yml'
      - 'packages/k6-api-adapter/src/**'
      - 'packages/k6-api-adapter/test/runtime-result*.js'
      - 'packages/k6-api-adapter/test/process-execution-lifecycle*.js'
      - 'schemas/execution/k6-api-runtime/**'
      - 'scripts/validate-m3-r3-p3-sanitized-runtime-result.js'
      - 'docs/02-development/m3-r3-p3-sanitized-runtime-result-handoff.md'
      - 'docs/03-roadmap/m3-r3-p3-sanitized-runtime-result.md'
      - 'docs/04-governance/m3-r3-p3-sanitized-runtime-result-acceptance-matrix.md'
      - 'docs/05-adr/ADR-0033-sanitized-runtime-result-and-immutable-evidence.md'
      - 'docs/06-security/m3-r3-p3-sanitized-runtime-result-threat-model.md'
      - 'docs/releases/M3-R3-P3-sanitized-runtime-result.md'
      - 'docs/README.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-r3-p3-sanitized-runtime-result.yml'
      - 'packages/k6-api-adapter/src/**'
      - 'packages/k6-api-adapter/test/runtime-result*.js'
      - 'packages/k6-api-adapter/test/process-execution-lifecycle*.js'
      - 'schemas/execution/k6-api-runtime/**'
      - 'scripts/validate-m3-r3-p3-sanitized-runtime-result.js'
      - 'docs/02-development/m3-r3-p3-sanitized-runtime-result-handoff.md'
      - 'docs/03-roadmap/m3-r3-p3-sanitized-runtime-result.md'
      - 'docs/04-governance/m3-r3-p3-sanitized-runtime-result-acceptance-matrix.md'
      - 'docs/05-adr/ADR-0033-sanitized-runtime-result-and-immutable-evidence.md'
      - 'docs/06-security/m3-r3-p3-sanitized-runtime-result-threat-model.md'
      - 'docs/releases/M3-R3-P3-sanitized-runtime-result.md'
      - 'docs/README.md'
      - 'package.json'

permissions:
  contents: read

env:
  M3_R3_P3_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-sanitized-runtime-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact Head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$M3_R3_P3_EXACT_HEAD"
          test -z "$(git status --porcelain)"
          echo "checkedOutExactHead=$actual_head"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused P3 tests with injected fakes only
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/k6-api-adapter/test/runtime-result*.test.js 2>&1 \
            | tee /tmp/m3-r3-p3-focused.tap
      - name: Run all k6 API Adapter tests
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/k6-api-adapter/test/*.test.js 2>&1 \
            | tee /tmp/m3-r3-p3-adapter.tap
      - name: Run complete Node.js test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/m3-r3-p3-full-node.tap
      - name: Export exact test counts
        shell: bash
        run: |
          set -euo pipefail
          parse_tap() {
            local prefix="$1" file="$2"
            local total passed failed skipped
            total="$(awk '/^# tests /{value=$3} END{print value+0}' "$file")"
            passed="$(awk '/^# pass /{value=$3} END{print value+0}' "$file")"
            failed="$(awk '/^# fail /{value=$3} END{print value+0}' "$file")"
            skipped="$(awk '/^# skipped /{value=$3} END{print value+0}' "$file")"
            test "$total" -gt 0
            test "$failed" -eq 0
            printf '%s_TOTAL=%s\n%s_PASSED=%s\n%s_FAILED=%s\n%s_SKIPPED=%s\n' \
              "$prefix" "$total" "$prefix" "$passed" "$prefix" "$failed" \
              "$prefix" "$skipped" >> "$GITHUB_ENV"
          }
          parse_tap M3_R3_P3_FOCUSED /tmp/m3-r3-p3-focused.tap
          parse_tap M3_R3_P3_ADAPTER /tmp/m3-r3-p3-adapter.tap
          parse_tap M3_R3_P3_FULL /tmp/m3-r3-p3-full-node.tap
          printf 'M3_R3_P3_REPOSITORY_VALIDATOR=success\n' >> "$GITHUB_ENV"
      - name: Run complete Repository Validator
        run: npm run validate
      - name: Re-run P3 validator explicitly
        run: npm run validate:m3-r3-p3-sanitized-runtime-result
      - name: Run accepted predecessor anti-regression validators
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:m3-r3-p2-bounded-process-lifecycle
          npm run validate:m3-r3-p1-local-process-boundary
          npm run validate:m3-r3-runtime-admission
          npm run validate:m3-r2-source-generation-p5
          npm run validate:m3-r1-k6-api-spec-compiler
          npm run validate:m3-r0-execution-contracts
          npm run validate:m2-final-release-closure
          npm run validate:m2-portable-release-readiness
          npm run validate:m2-r2a-external-evidence-intake
      - name: Generate static exact-Head P3 Evidence and Artifact payload
        env:
          M3_R3_P3_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_P3_EXACT_HEAD"
          mkdir -p /tmp/m3-r3-p3-artifact/evidence \
            /tmp/m3-r3-p3-artifact/logs
          node scripts/validate-m3-r3-p3-sanitized-runtime-result.js \
            > /tmp/m3-r3-p3-artifact/evidence/m3-r3-p3-sanitized-runtime-result-evidence.json
          cp --parents schemas/execution/k6-api-runtime/p3-schema-catalog.json \
            schemas/execution/k6-api-runtime/v1/k6-process-terminal-observation.schema.json \
            schemas/execution/k6-api-runtime/v1/k6-sanitized-runtime-outcome.schema.json \
            schemas/execution/k6-api-runtime/v1/k6-runtime-execution-evidence.schema.json \
            schemas/execution/k6-api-runtime/v1/m3-r3-sanitized-runtime-result-p3-evidence.schema.json \
            /tmp/m3-r3-p3-artifact/
          cp --parents docs/02-development/m3-r3-p3-sanitized-runtime-result-handoff.md \
            docs/03-roadmap/m3-r3-p3-sanitized-runtime-result.md \
            docs/04-governance/m3-r3-p3-sanitized-runtime-result-acceptance-matrix.md \
            docs/05-adr/ADR-0033-sanitized-runtime-result-and-immutable-evidence.md \
            docs/06-security/m3-r3-p3-sanitized-runtime-result-threat-model.md \
            docs/releases/M3-R3-P3-sanitized-runtime-result.md \
            /tmp/m3-r3-p3-artifact/
          cp /tmp/m3-r3-p3-focused.tap /tmp/m3-r3-p3-adapter.tap \
            /tmp/m3-r3-p3-full-node.tap /tmp/m3-r3-p3-artifact/logs/
          test -z "$(git status --porcelain)"
      - name: Independently validate P3 Evidence, Schema and digests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { canonicalStringify, sha256 } from '@kdtp/knowledge-core';
          const root = '/tmp/m3-r3-p3-artifact';
          const evidence = JSON.parse(await readFile(
            `${root}/evidence/m3-r3-p3-sanitized-runtime-result-evidence.json`, 'utf8'));
          const schema = JSON.parse(await readFile(
            `${root}/schemas/execution/k6-api-runtime/v1/m3-r3-sanitized-runtime-result-p3-evidence.schema.json`,
            'utf8'));
          function validate(value, rule, rootSchema = schema, path = '$') {
            if (rule.$ref) {
              const target = rule.$ref.slice(2).split('/').reduce((current, token) =>
                current[token.replaceAll('~1', '/').replaceAll('~0', '~')], rootSchema);
              return validate(value, target, rootSchema, path);
            }
            if (Object.hasOwn(rule, 'const')
                && canonicalStringify(value) !== canonicalStringify(rule.const)) {
              throw new Error(`${path} const mismatch`);
            }
            if (rule.enum && !rule.enum.includes(value)) throw new Error(`${path} enum mismatch`);
            if (rule.anyOf) {
              const accepted = rule.anyOf.some((candidate) => {
                try { validate(value, candidate, rootSchema, path); return true; } catch { return false; }
              });
              if (!accepted) throw new Error(`${path} anyOf mismatch`);
              return;
            }
            if (rule.type === 'object') {
              if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${path} type`);
              const properties = rule.properties ?? {};
              for (const key of rule.required ?? []) {
                if (!Object.hasOwn(value, key)) throw new Error(`${path}.${key} required`);
              }
              if (rule.additionalProperties === false
                  && canonicalStringify(Object.keys(value).sort())
                    !== canonicalStringify(Object.keys(properties).sort())) {
                throw new Error(`${path} closed fields mismatch`);
              }
              for (const [key, child] of Object.entries(properties)) {
                if (Object.hasOwn(value, key)) validate(value[key], child, rootSchema, `${path}.${key}`);
              }
            } else if (rule.type === 'array') {
              if (!Array.isArray(value)) throw new Error(`${path} type`);
              if (rule.maxItems !== undefined && value.length > rule.maxItems) throw new Error(`${path} maxItems`);
            } else if (rule.type === 'string') {
              if (typeof value !== 'string') throw new Error(`${path} type`);
              if (rule.minLength !== undefined && value.length < rule.minLength) throw new Error(`${path} minLength`);
              if (rule.maxLength !== undefined && value.length > rule.maxLength) throw new Error(`${path} maxLength`);
              if (rule.pattern && !(new RegExp(rule.pattern, 'u')).test(value)) throw new Error(`${path} pattern`);
            } else if (rule.type === 'integer') {
              if (!Number.isInteger(value)) throw new Error(`${path} type`);
              if (rule.minimum !== undefined && value < rule.minimum) throw new Error(`${path} minimum`);
            } else if (rule.type === 'boolean' && typeof value !== 'boolean') {
              throw new Error(`${path} type`);
            }
          }
          validate(evidence, schema);
          const claims = structuredClone(evidence);
          delete claims.evidenceDigest;
          if (sha256(claims) !== evidence.evidenceDigest) throw new Error('Evidence digest mismatch');
          const catalog = JSON.parse(await readFile(
            `${root}/schemas/execution/k6-api-runtime/p3-schema-catalog.json`, 'utf8'));
          const schemas = [];
          for (const entry of catalog.schemas) {
            const source = JSON.parse(await readFile(`${root}/${entry.path}`, 'utf8'));
            schemas.push({ ...entry, schemaDigest: sha256(source) });
          }
          const catalogDigest = sha256({ schemaVersion: catalog.schemaVersion, schemas });
          if (catalogDigest !== evidence.contracts.schemaCatalogDigest) {
            throw new Error('Schema Catalog digest mismatch');
          }
          if (evidence.source.commitSha !== process.env.M3_R3_P3_EXACT_HEAD) {
            throw new Error('Evidence exact Head mismatch');
          }
          console.log('evidence schema errors: 0');
          console.log(`canonicalEvidenceDigest=${evidence.evidenceDigest}`);
          console.log(`schemaCatalogDigest=${catalogDigest}`);
          console.log(`runtimeExecutionEvidenceDigest=${evidence.runtimeSample.runtimeExecutionEvidenceDigest}`);
          NODE
      - name: Verify exact Artifact layout and credential-shaped scan
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { lstat, readdir, readFile } from 'node:fs/promises';
          import { join, relative, sep } from 'node:path';
          import { scanSensitiveValues } from './packages/k6-api-adapter/test/p5-test-helpers.js';
          const root = '/tmp/m3-r3-p3-artifact';
          const expectedPaths = [
            'evidence/m3-r3-p3-sanitized-runtime-result-evidence.json',
            'schemas/execution/k6-api-runtime/p3-schema-catalog.json',
            'schemas/execution/k6-api-runtime/v1/k6-process-terminal-observation.schema.json',
            'schemas/execution/k6-api-runtime/v1/k6-sanitized-runtime-outcome.schema.json',
            'schemas/execution/k6-api-runtime/v1/k6-runtime-execution-evidence.schema.json',
            'schemas/execution/k6-api-runtime/v1/m3-r3-sanitized-runtime-result-p3-evidence.schema.json',
            'docs/02-development/m3-r3-p3-sanitized-runtime-result-handoff.md',
            'docs/03-roadmap/m3-r3-p3-sanitized-runtime-result.md',
            'docs/04-governance/m3-r3-p3-sanitized-runtime-result-acceptance-matrix.md',
            'docs/05-adr/ADR-0033-sanitized-runtime-result-and-immutable-evidence.md',
            'docs/06-security/m3-r3-p3-sanitized-runtime-result-threat-model.md',
            'docs/releases/M3-R3-P3-sanitized-runtime-result.md',
            'logs/m3-r3-p3-focused.tap',
            'logs/m3-r3-p3-adapter.tap',
            'logs/m3-r3-p3-full-node.tap',
          ];
          async function walk(directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await walk(path));
              else if (entry.isFile()) files.push(path);
              else throw new Error(`unsafe Artifact entry: ${path}`);
            }
            return files;
          }
          const files = await walk(root);
          const relativePaths = files.map((path) => relative(root, path).split(sep).join('/'));
          if (relativePaths.length !== expectedPaths.length) throw new Error('Artifact entry count mismatch');
          const actual = new Set(relativePaths);
          for (const expected of expectedPaths) {
            if (!actual.has(expected)) throw new Error(`missing Artifact path: ${expected}`);
          }
          for (const path of relativePaths) {
            if (!expectedPaths.includes(path)) throw new Error(`unexpected Artifact path: ${path}`);
            if (path.startsWith('/') || path.includes('..') || path.includes('\\') || path.includes('\0')
                || /^[A-Za-z]:/u.test(path) || path.startsWith('//')) {
              throw new Error(`dangerous Artifact path: ${path}`);
            }
          }
          const collision = new Set();
          for (const path of relativePaths) {
            const key = path.normalize('NFC').toLowerCase();
            if (collision.has(key)) throw new Error(`Artifact path collision: ${path}`);
            collision.add(key);
          }
          for (const path of files) {
            const stat = await lstat(path);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`unsafe Artifact file: ${path}`);
            scanSensitiveValues(await readFile(path, 'utf8'), path);
          }
          console.log(`artifact layout: ${files.length} safe, exact, unique regular files`);
          console.log(`credential-shaped scan: zero matches across ${files.length} files`);
          NODE
      - name: Print independently auditable P3 summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile(
            '/tmp/m3-r3-p3-artifact/evidence/m3-r3-p3-sanitized-runtime-result-evidence.json',
            'utf8'));
          console.log(`exactHead=${evidence.source.commitSha}`);
          console.log(`focused=${evidence.testResults.focused.passed}/${evidence.testResults.focused.total}`);
          console.log(`allK6ApiAdapter=${evidence.testResults.k6ApiAdapter.passed}/${evidence.testResults.k6ApiAdapter.total}`);
          console.log(`fullNode=${evidence.testResults.fullNode.passed}+${evidence.testResults.fullNode.skipped}/${evidence.testResults.fullNode.total}`);
          console.log(`canonicalEvidenceDigest=${evidence.evidenceDigest}`);
          console.log(`schemaCatalogDigest=${evidence.contracts.schemaCatalogDigest}`);
          console.log(`runtimeExecutionEvidenceDigest=${evidence.runtimeSample.runtimeExecutionEvidenceDigest}`);
          console.log(`fileResultCollectionSupported=${evidence.decision.fileResultCollectionSupported}`);
          console.log(`nextRequiredSlice=${evidence.decision.nextRequiredSlice}`);
          NODE
      - name: Upload permanent P3 Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-r3-p3-sanitized-runtime-result-evidence
          path: /tmp/m3-r3-p3-artifact
          if-no-files-found: error
          retention-days: 90
