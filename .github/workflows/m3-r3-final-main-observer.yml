name: m3-r3-final-main-observer

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r3-final-main-observer.yml'
      - 'scripts/m3-r3-final-main-observer.js'
      - 'scripts/m3-r3-final-main/**'
      - 'scripts/json-schema-draft-2020.js'
      - 'scripts/collect-m2-main-branch-ci-evidence.js'
      - 'packages/k6-api-adapter/test/m3-r3-final-main-observer.test.js'
      - 'schemas/execution/k6-api-runtime/README.md'
      - 'schemas/execution/k6-api-runtime/v1/m3-r3-final-main-closure.schema.json'
      - 'docs/04-governance/m3-r3-final-main-closure.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-r3-final-main-observer.yml'
      - 'scripts/m3-r3-final-main-observer.js'
      - 'scripts/m3-r3-final-main/**'
      - 'scripts/json-schema-draft-2020.js'
      - 'scripts/collect-m2-main-branch-ci-evidence.js'
      - 'packages/k6-api-adapter/test/m3-r3-final-main-observer.test.js'
      - 'schemas/execution/k6-api-runtime/README.md'
      - 'schemas/execution/k6-api-runtime/v1/m3-r3-final-main-closure.schema.json'
      - 'docs/04-governance/m3-r3-final-main-closure.md'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  M3_R3_FINAL_OBSERVER_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  M3_R3_FINAL_OBSERVER_BRANCH: ${{ github.head_ref || github.ref_name }}
  M3_R3_FINAL_OBSERVER_EVENT_NAME: ${{ github.event_name }}

jobs:
  validate-final-main-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      evidence_digest: ${{ steps.observer_evidence.outputs.evidence_digest }}
    steps:
      - name: Check out exact Observer state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact Observer Head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_FINAL_OBSERVER_EXACT_HEAD"
          test -z "$(git status --porcelain)"
          echo "checkedOutExactHead=$M3_R3_FINAL_OBSERVER_EXACT_HEAD"
      - name: Set up baseline Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused Observer tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            packages/k6-api-adapter/test/m3-r3-final-main-observer.test.js \
            > /tmp/m3-r3-final-main-observer-focused-node22.tap 2>&1
          printf 'M3_R3_FINAL_OBSERVER_FOCUSED_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Run complete root validation chain
        shell: bash
        run: |
          set -euo pipefail
          npm run validate \
            > /tmp/m3-r3-final-main-observer-root-validation.log 2>&1
          printf 'M3_R3_FINAL_OBSERVER_ROOT_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Run dedicated Observer repository Validator
        shell: bash
        run: |
          set -euo pipefail
          node scripts/m3-r3-final-main-observer.js --validate-repository \
            > /tmp/m3-r3-final-main-observer-validator.log 2>&1
          printf 'M3_R3_FINAL_OBSERVER_VALIDATOR_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Generate and pre-audit exact Observer Evidence
        id: observer_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/m3-r3-final-main-observer.js --emit-artifact)"
          echo "$result"
          digest="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).evidenceDigest)' "$result")"
          echo "evidence_digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_FINAL_OBSERVER_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - name: Upload permanent Observer Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-r3-final-main-observer-evidence
          path: /tmp/m3-r3-final-main-observer-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  report-final-closure:
    if: ${{ github.event_name == 'push' }}
    needs: validate-final-main-observer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Append exact Run and Artifact identity to Issue 71
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id, per_page: 100,
            });
            const matches = artifacts.data.artifacts.filter(
              (item) => item.name === 'm3-r3-final-main-observer-evidence',
            );
            if (matches.length !== 1) {
              throw new Error(`Expected one Observer Artifact, found ${matches.length}`);
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id, filter: 'latest', per_page: 100,
            });
            const validateJobs = jobs.data.jobs.filter(
              (item) => item.name === 'validate-final-main-observer',
            );
            if (validateJobs.length !== 1 || validateJobs[0].conclusion !== 'success') {
              throw new Error('Observer validation Job is not uniquely successful');
            }
            const artifact = matches[0];
            const body = [
              '## Automated exact-main Observer self-report',
              '',
              '```text',
              `observerMergeSha=${context.sha}`,
              `runId=${run_id}`,
              `runAttempt=${process.env.GITHUB_RUN_ATTEMPT}`,
              `validationJobId=${validateJobs[0].id}`,
              `artifactId=${artifact.id}`,
              `artifactName=${artifact.name}`,
              `artifactApiDigest=${artifact.digest}`,
              `artifactSizeBytes=${artifact.size_in_bytes}`,
              `artifactExpired=${artifact.expired}`,
              `evidenceDigest=${{ needs.validate-final-main-observer.outputs.evidence_digest }}`,
              'manualRerunPerformed=false',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: 71, body,
            });
