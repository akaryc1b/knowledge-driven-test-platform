name: m3-r0-execution-contract-foundation

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r0-execution-contract-foundation.yml'
      - 'packages/execution-contract/**'
      - 'schemas/execution/**'
      - 'scripts/validate-m3-r0-execution-contracts.js'
      - 'examples/execution-contracts.js'
      - 'docs/02-development/development-handoff.md'
      - 'docs/03-roadmap/m3-r0-execution-adapter-foundation.md'
      - 'docs/03-roadmap/roadmap.md'
      - 'docs/04-governance/m3-r0-execution-contract-acceptance-matrix.md'
      - 'docs/05-adr/ADR-0027-contract-first-execution-boundary.md'
      - 'docs/releases/M3-R0-execution-contract-foundation.md'
      - 'docs/README.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-r0-execution-contract-foundation.yml'
      - 'packages/execution-contract/**'
      - 'schemas/execution/**'
      - 'scripts/validate-m3-r0-execution-contracts.js'
      - 'examples/execution-contracts.js'
      - 'docs/02-development/development-handoff.md'
      - 'docs/03-roadmap/m3-r0-execution-adapter-foundation.md'
      - 'docs/03-roadmap/roadmap.md'
      - 'docs/04-governance/m3-r0-execution-contract-acceptance-matrix.md'
      - 'docs/05-adr/ADR-0027-contract-first-execution-boundary.md'
      - 'docs/releases/M3-R0-execution-contract-foundation.md'
      - 'docs/README.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused execution contract tests
        run: node --test packages/execution-contract/test/*.test.js
      - name: Run full Node test suite
        run: npm test
      - name: Run repository validation
        run: npm run validate
      - name: Generate M3-R0 execution contract evidence
        env:
          M3_R0_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$M3_R0_EVIDENCE_SOURCE_SHA" npm run --silent validate:m3-r0-execution-contracts > /tmp/m3-r0-execution-contract-evidence.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('/tmp/m3-r0-execution-contract-evidence.json', 'utf8'));
          if (evidence.decision?.contractFoundationReady !== true
              || evidence.decision?.executionImplementationStarted !== false
              || evidence.decision?.nextRequiredSlice !== 'M3-R1'
              || evidence.decision?.repositoryBlockers?.length !== 0) {
            throw new Error('M3-R0 execution contract decision is invalid');
          }
          if (Object.values(evidence.safetyBoundary ?? {}).some((value) => value !== false)) {
            throw new Error('M3-R0 non-execution safety boundary changed');
          }
          NODE
      - name: Upload M3-R0 execution contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-r0-execution-contract-evidence
          path: |
            /tmp/m3-r0-execution-contract-evidence.json
            schemas/execution/schema-catalog.json
            schemas/execution/v1/*.schema.json
            docs/03-roadmap/m3-r0-execution-adapter-foundation.md
            docs/04-governance/m3-r0-execution-contract-acceptance-matrix.md
            docs/05-adr/ADR-0027-contract-first-execution-boundary.md
            docs/releases/M3-R0-execution-contract-foundation.md
          if-no-files-found: error
          retention-days: 90
