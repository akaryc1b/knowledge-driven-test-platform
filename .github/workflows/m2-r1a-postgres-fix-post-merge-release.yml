name: m2-r1a-postgres-fix-post-merge-release

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact main push and dispatch corrected image release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: 6bef789da58bbb7f2edd2a2024ba9a0bbf8e22a7
          RELEASE_ID: M2-RC1
          RELEASE_VERSION: 0.12.0
        run: |
          node --input-type=module <<'EOF'
          import { writeFile } from 'node:fs/promises';

          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const sourceSha = process.env.SOURCE_SHA;
          const releaseId = process.env.RELEASE_ID;
          const version = process.env.RELEASE_VERSION;
          const requiredArtifacts = [
            'm1-release-candidate-evidence',
            'm2-release-candidate-evidence',
            'm2-post-merge-acceptance-evidence',
            'postgres-test-log',
            'repository-validation-log',
            'deployment-validation-log',
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers ?? {}),
              },
            });
            if (!response.ok && response.status !== 204) {
              throw new Error(`${options.method ?? 'GET'} ${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          };

          let validationRun;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const data = await api('/actions/workflows/321111055/runs?branch=main&event=push&per_page=100');
            validationRun = data.workflow_runs.find((run) => run.head_sha === sourceSha);
            if (validationRun?.status === 'completed') break;
            await sleep(10_000);
          }
          if (!validationRun || validationRun.status !== 'completed') {
            throw new Error(`Exact main push validation was not completed for ${sourceSha}`);
          }
          if (validationRun.conclusion !== 'success') {
            throw new Error(`Exact main push validation failed: ${validationRun.id}/${validationRun.conclusion}`);
          }

          const jobsData = await api(`/actions/runs/${validationRun.id}/jobs?per_page=100`);
          const validateJob = jobsData.jobs.find((job) => job.name === 'validate');
          const postgresJob = jobsData.jobs.find((job) => job.name === 'postgres-integration');
          if (validateJob?.conclusion !== 'success' || postgresJob?.conclusion !== 'success') {
            throw new Error('Required validation jobs are not successful');
          }
          const deploymentStep = validateJob.steps?.find((step) => step.name === 'Run deployment validation');
          if (deploymentStep?.conclusion !== 'success') {
            throw new Error('Deployment Validator step is not successful');
          }
          const postgresExamplesStep = postgresJob.steps?.find((step) => step.name === 'Run all PostgreSQL examples');
          if (postgresExamplesStep?.conclusion !== 'success') {
            throw new Error('PostgreSQL examples step is not successful');
          }

          const artifactData = await api(`/actions/runs/${validationRun.id}/artifacts?per_page=100`);
          const artifacts = Object.fromEntries(artifactData.artifacts.map((artifact) => [artifact.name, artifact]));
          for (const name of requiredArtifacts) {
            const artifact = artifacts[name];
            if (!artifact || artifact.expired || !/^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? '')) {
              throw new Error(`Required Artifact is missing, expired or invalid: ${name}`);
            }
          }

          const dispatchStartedAt = new Date();
          await api('/actions/workflows/m2-release-image.yml/dispatches', {
            method: 'POST',
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                source_sha: sourceSha,
                release_id: releaseId,
                version,
              },
            }),
          });

          let releaseRun;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            const data = await api('/actions/workflows/m2-release-image.yml/runs?branch=main&event=workflow_dispatch&per_page=30');
            releaseRun = data.workflow_runs.find((run) => (
              run.head_sha === sourceSha
              && new Date(run.created_at).getTime() >= dispatchStartedAt.getTime() - 5_000
            ));
            if (releaseRun) break;
            await sleep(2_000);
          }
          if (!releaseRun) throw new Error('Corrected release Workflow run was not observed');

          const evidence = {
            schemaVersion: 'm2-r1a-postgres-fix-post-merge-release-controller/v1',
            sourceSha,
            mainPushValidation: {
              runId: validationRun.id,
              workflowId: validationRun.workflow_id,
              conclusion: validationRun.conclusion,
              validateJobId: validateJob.id,
              postgresJobId: postgresJob.id,
              deploymentValidator: deploymentStep.conclusion,
              postgresExamples: postgresExamplesStep.conclusion,
              eligibleForClosure: true,
              artifacts: Object.fromEntries(requiredArtifacts.map((name) => [name, {
                id: artifacts[name].id,
                digest: artifacts[name].digest,
              }])),
            },
            dispatch: {
              workflow: 'm2-release-image.yml',
              releaseId,
              version,
              runId: releaseRun.id,
              headSha: releaseRun.head_sha,
              event: releaseRun.event,
              status: releaseRun.status,
            },
          };
          await writeFile('/tmp/m2-r1a-postgres-fix-post-merge-release-controller.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(JSON.stringify(evidence));
          EOF

      - name: Upload verification and dispatch evidence
        uses: actions/upload-artifact@v4
        with:
          name: m2-r1a-postgres-fix-post-merge-release-controller
          path: /tmp/m2-r1a-postgres-fix-post-merge-release-controller.json
          if-no-files-found: error
          retention-days: 90
