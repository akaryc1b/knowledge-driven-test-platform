name: m2-r2a-post-merge-observer

on:
  pull_request:
    paths:
      - '.github/workflows/m2-r2a-post-merge-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Collect exact R2-A post-merge workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 5acb578ec799d3ab6d1c6e217787231cba23c104
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/m2-r2a-post-merge-observation.json
          const repository = process.env.REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const token = process.env.GITHUB_TOKEN;
          const apiRoot = `https://api.github.com/repos/${repository}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kdtp-r2a-post-merge-observer',
          };

          async function api(path) {
            const response = await fetch(`${apiRoot}${path}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${path} failed with ${response.status}`);
            }
            return response.json();
          }

          const workflowDefinitions = [
            {
              key: 'validation',
              name: 'validation',
              path: '.github/workflows/validation.yml',
              requiredJobs: ['validate', 'postgres-integration'],
              requiredArtifacts: [
                'repository-validation-log',
                'deployment-validation-log',
                'm2-r2a-external-evidence-intake-evidence',
                'postgres-test-log',
              ],
            },
            {
              key: 'r2aAcceptance',
              name: 'm2-r2a-external-evidence-intake',
              path: '.github/workflows/m2-r2a-external-evidence-intake.yml',
              requiredJobs: ['validate-intake', 'postgres-integration'],
              requiredArtifacts: [
                'm2-r2a-external-evidence-intake-evidence',
                'm2-r2a-postgres-test-log',
              ],
            },
          ];

          let selectedRuns;
          for (let attempt = 0; attempt < 18; attempt += 1) {
            const response = await api(
              `/actions/runs?head_sha=${encodeURIComponent(targetSha)}&branch=main&event=push&per_page=100`,
            );
            selectedRuns = Object.fromEntries(workflowDefinitions.map((definition) => {
              const matches = response.workflow_runs
                .filter((run) => run.name === definition.name
                  && run.path === definition.path
                  && run.event === 'push'
                  && run.head_branch === 'main'
                  && run.head_sha === targetSha)
                .sort((left, right) => right.id - left.id);
              return [definition.key, matches[0] ?? null];
            }));
            const found = workflowDefinitions.every((definition) => selectedRuns[definition.key]);
            const completed = found && workflowDefinitions.every(
              (definition) => selectedRuns[definition.key].status === 'completed',
            );
            if (completed) break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }

          const observedRuns = {};
          for (const definition of workflowDefinitions) {
            const run = selectedRuns?.[definition.key];
            if (!run) throw new Error(`Missing ${definition.name} push run for ${targetSha}`);
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`${definition.name} push run is not successful`);
            }

            const jobsResponse = await api(`/actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
            const jobs = jobsResponse.jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
            }));
            for (const requiredJob of definition.requiredJobs) {
              const job = jobs.find((candidate) => candidate.name === requiredJob);
              if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
                throw new Error(`${definition.name} required job ${requiredJob} is not successful`);
              }
            }
            if (jobs.some((job) => job.status !== 'completed' || job.conclusion !== 'success')) {
              throw new Error(`${definition.name} contains a non-successful job`);
            }

            const artifactsResponse = await api(`/actions/runs/${run.id}/artifacts?per_page=100`);
            const artifacts = artifactsResponse.artifacts.map((artifact) => ({
              id: artifact.id,
              name: artifact.name,
              digest: artifact.digest,
              expired: artifact.expired,
              createdAt: artifact.created_at,
              expiresAt: artifact.expires_at,
            }));
            for (const requiredArtifact of definition.requiredArtifacts) {
              const artifact = artifacts.find((candidate) => candidate.name === requiredArtifact);
              if (!artifact || artifact.expired !== false
                  || !/^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? '')) {
                throw new Error(`${definition.name} required Artifact ${requiredArtifact} is invalid`);
              }
            }

            observedRuns[definition.key] = {
              id: run.id,
              name: run.name,
              workflowPath: run.path,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              jobs,
              artifacts,
            };
          }

          const evidence = {
            schemaVersion: 'm2-r2a-post-merge-observation/v1',
            releaseId: 'M2-RC1',
            version: '0.12.0',
            observedAt: new Date().toISOString(),
            target: {
              branch: 'main',
              sha: targetSha,
            },
            runs: observedRuns,
            decision: {
              exactMainPushVerified: true,
              independentR2AAcceptanceVerified: true,
              eligibleToBeginR2BPreflight: true,
              productionEligible: false,
              resolvedBlockers: [
                'main-branch-final-ci-not-verified',
                'external-registry-digest-missing',
              ],
              openBlockers: [
                'production-secrets-not-configured',
                'target-cluster-validation-not-run',
                'change-approval-missing',
                'release-owner-approval-missing',
              ],
            },
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Validate observation boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('/tmp/m2-r2a-post-merge-observation.json', 'utf8'));
          if (evidence.target?.sha !== '5acb578ec799d3ab6d1c6e217787231cba23c104') {
            throw new Error('Observed main SHA is invalid');
          }
          if (evidence.decision?.exactMainPushVerified !== true
              || evidence.decision?.independentR2AAcceptanceVerified !== true
              || evidence.decision?.eligibleToBeginR2BPreflight !== true) {
            throw new Error('R2-A post-merge observation is incomplete');
          }
          if (evidence.decision?.productionEligible !== false
              || evidence.decision?.openBlockers?.length !== 4) {
            throw new Error('R2-A post-merge boundary changed');
          }
          NODE

      - name: Upload exact R2-A post-merge observation
        uses: actions/upload-artifact@v4
        with:
          name: m2-r2a-post-merge-observation
          path: /tmp/m2-r2a-post-merge-observation.json
          if-no-files-found: error
          retention-days: 90
