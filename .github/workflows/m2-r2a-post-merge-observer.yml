name: m2-r2a-post-merge-observer

on:
  pull_request:
    paths:
      - '.github/workflows/m2-r2a-post-merge-observer.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Collect exact R2-A post-merge workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 286bdab429ee7365082b8b5abaff1b5b981d9ef7
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/m2-r2a-post-merge-observation.json
          const repository = process.env.REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const token = process.env.GITHUB_TOKEN;
          const apiRoot = `https://api.github.com/repos/${repository}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kdtp-r2a-post-merge-observer',
          };

          async function api(path) {
            const response = await fetch(`${apiRoot}${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${path} failed with ${response.status}`);
            return response.json();
          }

          const definitions = [
            {
              key: 'validation',
              name: 'validation',
              path: '.github/workflows/validation.yml',
              jobs: ['validate', 'postgres-integration'],
              artifacts: [
                'repository-validation-log',
                'deployment-validation-log',
                'm2-r2a-external-evidence-intake-evidence',
                'postgres-test-log',
              ],
            },
            {
              key: 'r2aAcceptance',
              name: 'm2-r2a-external-evidence-intake',
              path: '.github/workflows/m2-r2a-external-evidence-intake.yml',
              jobs: ['validate-intake', 'postgres-integration'],
              artifacts: [
                'm2-r2a-external-evidence-intake-evidence',
                'm2-r2a-postgres-test-log',
              ],
            },
          ];

          let selected = {};
          for (let attempt = 0; attempt < 24; attempt += 1) {
            const response = await api(
              `/actions/runs?head_sha=${encodeURIComponent(targetSha)}&branch=main&event=push&per_page=100`,
            );
            selected = Object.fromEntries(definitions.map((definition) => {
              const runs = response.workflow_runs
                .filter((run) => run.name === definition.name
                  && run.path === definition.path
                  && run.event === 'push'
                  && run.head_branch === 'main'
                  && run.head_sha === targetSha)
                .sort((left, right) => right.id - left.id);
              return [definition.key, runs[0] ?? null];
            }));
            if (definitions.every(({ key }) => selected[key]?.status === 'completed')) break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }

          const runs = {};
          const verified = {};
          for (const definition of definitions) {
            const run = selected[definition.key];
            if (!run) {
              runs[definition.key] = { missing: true };
              verified[definition.key] = false;
              continue;
            }
            const jobResponse = await api(`/actions/runs/${run.id}/jobs?filter=latest&per_page=100`);
            const jobs = jobResponse.jobs.map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
            }));
            const artifactResponse = await api(`/actions/runs/${run.id}/artifacts?per_page=100`);
            const artifacts = artifactResponse.artifacts.map((artifact) => ({
              id: artifact.id,
              name: artifact.name,
              digest: artifact.digest,
              expired: artifact.expired,
              createdAt: artifact.created_at,
              expiresAt: artifact.expires_at,
            }));
            const requiredJobsSuccessful = definition.jobs.every((name) => {
              const job = jobs.find((candidate) => candidate.name === name);
              return job?.status === 'completed' && job?.conclusion === 'success';
            });
            const requiredArtifactsValid = definition.artifacts.every((name) => {
              const artifact = artifacts.find((candidate) => candidate.name === name);
              return artifact?.expired === false && /^sha256:[a-f0-9]{64}$/.test(artifact?.digest ?? '');
            });
            const exactIdentity = run.name === definition.name
              && run.path === definition.path
              && run.event === 'push'
              && run.head_branch === 'main'
              && run.head_sha === targetSha;
            const runSuccessful = run.status === 'completed' && run.conclusion === 'success';
            verified[definition.key] = exactIdentity
              && runSuccessful
              && requiredJobsSuccessful
              && requiredArtifactsValid;
            runs[definition.key] = {
              id: run.id,
              name: run.name,
              workflowPath: run.path,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              jobs,
              artifacts,
              verification: {
                exactIdentity,
                runSuccessful,
                requiredJobsSuccessful,
                requiredArtifactsValid,
              },
            };
          }

          const exactMainPushVerified = verified.validation === true;
          const independentR2AAcceptanceVerified = verified.r2aAcceptance === true;
          process.stdout.write(`${JSON.stringify({
            schemaVersion: 'm2-r2a-post-merge-observation/v1',
            releaseId: 'M2-RC1',
            version: '0.12.0',
            observedAt: new Date().toISOString(),
            target: { branch: 'main', sha: targetSha },
            runs,
            decision: {
              exactMainPushVerified,
              independentR2AAcceptanceVerified,
              eligibleToBeginR2BPreflight: exactMainPushVerified && independentR2AAcceptanceVerified,
              productionEligible: false,
              resolvedBlockers: [
                'main-branch-final-ci-not-verified',
                'external-registry-digest-missing',
              ],
              openBlockers: [
                'production-secrets-not-configured',
                'target-cluster-validation-not-run',
                'change-approval-missing',
                'release-owner-approval-missing',
              ],
            },
          }, null, 2)}\n`);
          NODE

      - name: Upload exact R2-A post-merge observation
        uses: actions/upload-artifact@v4
        with:
          name: m2-r2a-post-merge-observation
          path: /tmp/m2-r2a-post-merge-observation.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce R2-A post-merge gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('/tmp/m2-r2a-post-merge-observation.json', 'utf8'));
          if (evidence.target?.sha !== '286bdab429ee7365082b8b5abaff1b5b981d9ef7') {
            throw new Error('Observed main SHA is invalid');
          }
          if (evidence.decision?.exactMainPushVerified !== true) {
            throw new Error('Exact main push Validation is not verified');
          }
          if (evidence.decision?.independentR2AAcceptanceVerified !== true) {
            throw new Error('Independent R2-A acceptance is not verified');
          }
          if (evidence.decision?.eligibleToBeginR2BPreflight !== true) {
            throw new Error('R2-B preflight remains blocked');
          }
          if (evidence.decision?.productionEligible !== false
              || evidence.decision?.openBlockers?.length !== 4) {
            throw new Error('R2-A post-merge boundary changed');
          }
          NODE
