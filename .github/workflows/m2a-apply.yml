name: m2a-apply

on:
  push:
    branches:
      - agent/m2-a-test-planning-contracts

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('packages/test-plan/package.json') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-a-test-planning-contracts
          fetch-depth: 0
      - name: Apply verified offline implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m2a-patch.part* > /tmp/m2a.patch.gz
          test "$(sha256sum /tmp/m2a.patch.gz | cut -d' ' -f1)" = "636b891499e043b64975a573f5e43df4f5b2a74f1e7466746e1febbf27059c52"
          gzip -dc /tmp/m2a.patch.gz > /tmp/m2a.patch
          test "$(sha256sum /tmp/m2a.patch | cut -d' ' -f1)" = "03e30ba65585e3b3c436af2939dc1976e9a2bb88190214eaa34c3a74914fcc7c"
          git apply --check /tmp/m2a.patch
          git apply /tmp/m2a.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic test planning contracts"
          git push origin HEAD:agent/m2-a-test-planning-contracts
