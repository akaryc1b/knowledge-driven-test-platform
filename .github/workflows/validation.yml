name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot-m2i-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-i-release-acceptance
      - name: Archive source workspace
        shell: bash
        run: tar --exclude=.git -czf /tmp/m2i-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: m2i-source-workspace
          path: /tmp/m2i-source.tar.gz
          if-no-files-found: error
