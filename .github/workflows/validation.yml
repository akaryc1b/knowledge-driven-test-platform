name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: npm run --silent example:approval > /tmp/approval-snapshot.json
      - run: npm run --silent example:registry > /tmp/registry-record.json
      - run: npm run --silent example:governance > /tmp/governance-evidence.json
      - run: npm run --silent example:query > /tmp/read-only-query.json
      - run: npm run --silent example:access > /tmp/project-membership-access.json
      - run: npm run --silent example:http > /tmp/read-only-http.json
      - run: npm run --silent example:oidc > /tmp/oidc-authentication.json

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kdtp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kdtp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KDTP_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/kdtp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts pg@8.22.0
      - name: Run PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee /tmp/postgres-test.log
      - name: Upload PostgreSQL test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-log
          path: /tmp/postgres-test.log
          if-no-files-found: error
      - run: npm run --silent example:governance:postgres > /tmp/postgres-governance.json
