name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-m2h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-h-planning-service-composition
          fetch-depth: 0
      - name: Assemble and verify M2-H implementation after chunk repair
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m2h.part* > /tmp/m2h-impl.tar.gz
          test "$(sha256sum /tmp/m2h-impl.tar.gz | cut -d' ' -f1)" = "aef49c05ce7609ff6b70480d021e20a1efb6a37b285478ef74764cfc87b5764a"
          tar -tzf /tmp/m2h-impl.tar.gz > /tmp/m2h-files.list
          tar -xzf /tmp/m2h-impl.tar.gz
          rm -f .github/m2h.part*
      - name: Commit M2-H implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git diff --cached --stat
          git commit -m "feat: compose Test Plan queries into read-only service"
          git push origin HEAD:agent/m2-h-planning-service-composition
