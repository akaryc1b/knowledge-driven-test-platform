name: validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-post-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-rc1-post-merge-acceptance
          fetch-depth: 0
      - name: Assemble verified post-merge archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m2-post.part* | base64 -d > /tmp/m2-post-merge-final.tar.gz
          test "$(sha256sum /tmp/m2-post-merge-final.tar.gz | cut -d' ' -f1)" = "602c2a84dbfbbf0612c0b07edfcd1c6ee3b5f5b257ce82d4bfed658c5ae6331c"
          tar -tzf /tmp/m2-post-merge-final.tar.gz > /tmp/m2-post-merge-final.list
      - name: Extract and commit post-merge acceptance
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/m2-post-merge-final.tar.gz
          rm -f .github/m2-post.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: add M2-RC1 post-merge acceptance"
          git push origin HEAD:agent/m2-rc1-post-merge-acceptance
