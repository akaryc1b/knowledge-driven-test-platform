name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-m2g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-g-read-only-plan-query-api
          fetch-depth: 0
      - name: Verify and extract M2-G implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/m2g-impl.tar.gz | cut -d' ' -f1)" = "6284e6bc482b6ba4aa328f3144a75b4a52aa363675c26edbafb04a80aa7c83af"
          tar -tzf .github/m2g-impl.tar.gz > /tmp/m2g-files.list
          tar -xzf .github/m2g-impl.tar.gz
          rm -f .github/m2g-impl.tar.gz
      - name: Commit M2-G implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git diff --cached --stat
          git commit -m "feat: add read-only Test Plan query API"
          git push origin HEAD:agent/m2-g-read-only-plan-query-api
