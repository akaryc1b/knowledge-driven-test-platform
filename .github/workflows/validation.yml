name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive M2-G source workspace
        shell: bash
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/m2g-source.tar.gz .
      - name: Upload M2-G source workspace
        uses: actions/upload-artifact@v4
        with:
          name: m2g-source-workspace
          path: /tmp/m2g-source.tar.gz
          if-no-files-found: error
