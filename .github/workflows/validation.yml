name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-m2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-e-plan-governance
          fetch-depth: 0
      - name: Extract verified M2-E package files
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/m2e-new-files.tar.gz | cut -d' ' -f1)" = "1de5a413097ee7230c8d04ecbabe130a47c224a6e90083788f2609b4010f2da9"
          tar -xzf .github/m2e-new-files.tar.gz
          git show HEAD^:.github/workflows/validation.yml > .github/workflows/validation.yml
          rm -f .github/m2e-new-files.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add plan governance package and example"
          git push origin HEAD:agent/m2-e-plan-governance
