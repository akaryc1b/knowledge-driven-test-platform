name: m2-r2-rebaseline-portable-release-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/m2-r2-rebaseline-portable-release-readiness.yml'
      - 'apps/read-only-governance-service/test/m2-portable-release-readiness*.test.js'
      - 'deploy/kubernetes/read-only-governance-service/README.md'
      - 'docs/03-roadmap/m2-rc1-production-promotion.md'
      - 'docs/04-governance/m2-production-promotion-acceptance-matrix.md'
      - 'docs/releases/M2-RC1-r2-rebaseline-portable-release-readiness.md'
      - 'docs/README.md'
      - 'package.json'
      - 'releases/m2/portable-release-readiness.json'
      - 'schemas/release/schema-catalog.json'
      - 'schemas/release/v3/m2-portable-release-readiness*.schema.json'
      - 'scripts/validate-m2-portable-release-readiness.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-r2-rebaseline-portable-release-readiness.yml'
      - 'apps/read-only-governance-service/test/m2-portable-release-readiness*.test.js'
      - 'deploy/kubernetes/read-only-governance-service/README.md'
      - 'docs/03-roadmap/m2-rc1-production-promotion.md'
      - 'docs/04-governance/m2-production-promotion-acceptance-matrix.md'
      - 'docs/releases/M2-RC1-r2-rebaseline-portable-release-readiness.md'
      - 'docs/README.md'
      - 'package.json'
      - 'releases/m2/portable-release-readiness.json'
      - 'schemas/release/schema-catalog.json'
      - 'schemas/release/v3/m2-portable-release-readiness*.schema.json'
      - 'scripts/validate-m2-portable-release-readiness.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused portable readiness tests
        run: node --test apps/read-only-governance-service/test/m2-portable-release-readiness.test.js
      - name: Run full Node test suite
        run: npm test
      - name: Run repository validation
        run: npm run validate
      - name: Validate immutable Deployment
        run: npm run validate:deployment
      - name: Validate historical Production Promotion
        run: npm run validate:m2-production-promotion
      - name: Validate historical R2-A intake
        run: npm run validate:m2-r2a-external-evidence-intake
      - name: Validate portable release readiness
        env:
          READINESS_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$READINESS_EVIDENCE_SOURCE_SHA" npm run --silent validate:m2-portable-release-readiness > /tmp/m2-portable-release-readiness-evidence.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile(
            '/tmp/m2-portable-release-readiness-evidence.json',
            'utf8',
          ));
          if (evidence.decision?.repositoryReleaseReady !== true) {
            throw new Error('Repository release readiness is not verified');
          }
          if (evidence.decision?.environmentPromotionEvaluated !== false
              || evidence.decision?.environmentPromotionEligible !== null) {
            throw new Error('Environment promotion must remain unevaluated');
          }
          if (evidence.decision?.repositoryBlockers?.length !== 0) {
            throw new Error('Repository release readiness contains blockers');
          }
          if (evidence.runtimeConfiguration?.providerAgnostic !== true
              || evidence.runtimeConfiguration?.repositoryStoresSecretValues !== false
              || evidence.runtimeConfiguration?.repositoryRequiresProviderMetadata !== false) {
            throw new Error('Portable runtime configuration boundary changed');
          }
          NODE
      - name: Build non-root read-only service image
        run: docker build -f apps/read-only-governance-service/Dockerfile -t kdtp-read-only-service:r2-rebaseline .
      - name: Verify container user
        run: test "$(docker image inspect kdtp-read-only-service:r2-rebaseline --format '{{.Config.User}}')" = "node"
      - name: Verify hardened container runtime
        run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop=ALL --security-opt no-new-privileges kdtp-read-only-service:r2-rebaseline node --version
      - name: Upload portable release readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: m2-portable-release-readiness-evidence
          path: |
            /tmp/m2-portable-release-readiness-evidence.json
            releases/m2/portable-release-readiness.json
            releases/m2/production-promotion.json
            releases/m2/r2a-external-evidence-intake.json
            releases/m2/r1b-image-binding.json
            releases/m2/release-image-evidence.json
            schemas/release/v3/m2-portable-release-readiness.schema.json
            schemas/release/v3/m2-portable-release-readiness-evidence.schema.json
            deploy/kubernetes/read-only-governance-service/deployment.yaml
            deploy/kubernetes/read-only-governance-service/configmap.yaml
            deploy/kubernetes/read-only-governance-service/kustomization.yaml
            deploy/kubernetes/read-only-governance-service/README.md
          if-no-files-found: error
          retention-days: 90

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kdtp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kdtp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kdtp_test
      KDTP_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/kdtp_test
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install PostgreSQL client dependency without changing the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.22.0
      - name: Run full PostgreSQL 18 integration suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tee /tmp/r2-rebaseline-postgres-test.log
      - name: Run all PostgreSQL examples
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent example:postgres > /tmp/postgres-registry.json
          npm run --silent example:governance:postgres > /tmp/postgres-governance.json
          npm run --silent example:plan-registry:postgres > /tmp/postgres-test-plan-registry.json
          npm run --silent example:planning-orchestration:postgres > /tmp/postgres-planning-orchestration.json
      - name: Upload portable readiness PostgreSQL test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-portable-readiness-postgres-test-log
          path: /tmp/r2-rebaseline-postgres-test.log
          if-no-files-found: error
          retention-days: 90

  observe-post-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Collect exact R2-Rebaseline post-merge workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 70b06e28e48c38d8b7feed29177144d35cb96069
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/m2-r2-rebaseline-post-merge-observation.json
          const repository = process.env.REPOSITORY;
          const targetSha = process.env.TARGET_SHA;
          const token = process.env.GITHUB_TOKEN;
          const apiRoot = `https://api.github.com/repos/${repository}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'kdtp-r2-rebaseline-post-merge-observer',
          };
          async function api(path) {
            const response = await fetch(`${apiRoot}${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${path} failed with ${response.status}`);
            return response.json();
          }
          const definitions = [
            {
              key: 'validation',
              name: 'validation',
              path: '.github/workflows/validation.yml',
              jobs: ['validate', 'postgres-integration'],
              artifacts: ['repository-validation-log', 'deployment-validation-log', 'm2-r2a-external-evidence-intake-evidence', 'postgres-test-log'],
            },
            {
              key: 'portableReadiness',
              name: 'm2-r2-rebaseline-portable-release-readiness',
              path: '.github/workflows/m2-r2-rebaseline-portable-release-readiness.yml',
              jobs: ['validate-readiness', 'postgres-integration'],
              artifacts: ['m2-portable-release-readiness-evidence', 'm2-portable-readiness-postgres-test-log'],
            },
            {
              key: 'historicalR2A',
              name: 'm2-r2a-external-evidence-intake',
              path: '.github/workflows/m2-r2a-external-evidence-intake.yml',
              jobs: ['validate-intake', 'postgres-integration'],
              artifacts: ['m2-r2a-external-evidence-intake-evidence', 'm2-r2a-postgres-test-log'],
            },
          ];
          let selected = {};
          for (let attempt = 0; attempt < 18; attempt += 1) {
            const response = await api(`/actions/runs?head_sha=${targetSha}&branch=main&event=push&per_page=100`);
            selected = Object.fromEntries(definitions.map((definition) => [
              definition.key,
              response.workflow_runs
                .filter((run) => run.name === definition.name
                  && run.path === definition.path
                  && run.event === 'push'
                  && run.head_branch === 'main'
                  && run.head_sha === targetSha)
                .sort((left, right) => right.id - left.id)[0] ?? null,
            ]));
            if (definitions.every((definition) => selected[definition.key]?.status === 'completed')) break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          const runs = {};
          const verified = {};
          for (const definition of definitions) {
            const run = selected[definition.key];
            if (!run) {
              runs[definition.key] = { missing: true };
              verified[definition.key] = false;
              continue;
            }
            const jobs = (await api(`/actions/runs/${run.id}/jobs?filter=latest&per_page=100`)).jobs
              .map((job) => ({ id: job.id, name: job.name, status: job.status, conclusion: job.conclusion }));
            const artifacts = (await api(`/actions/runs/${run.id}/artifacts?per_page=100`)).artifacts
              .map((artifact) => ({
                id: artifact.id,
                name: artifact.name,
                digest: artifact.digest,
                expired: artifact.expired,
                createdAt: artifact.created_at,
                expiresAt: artifact.expires_at,
              }));
            const requiredJobsSuccessful = definition.jobs.every((name) => {
              const job = jobs.find((candidate) => candidate.name === name);
              return job?.status === 'completed' && job?.conclusion === 'success';
            });
            const allJobsSuccessful = jobs.length > 0
              && jobs.every((job) => job.status === 'completed' && job.conclusion === 'success');
            const requiredArtifactsValid = definition.artifacts.every((name) => {
              const artifact = artifacts.find((candidate) => candidate.name === name);
              return artifact?.expired === false && /^sha256:[a-f0-9]{64}$/.test(artifact?.digest ?? '');
            });
            const exactIdentity = run.name === definition.name
              && run.path === definition.path
              && run.event === 'push'
              && run.head_branch === 'main'
              && run.head_sha === targetSha;
            const runSuccessful = run.status === 'completed' && run.conclusion === 'success';
            verified[definition.key] = exactIdentity
              && runSuccessful
              && requiredJobsSuccessful
              && allJobsSuccessful
              && requiredArtifactsValid;
            runs[definition.key] = {
              id: run.id,
              name: run.name,
              workflowPath: run.path,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              jobs,
              artifacts,
              verification: { exactIdentity, runSuccessful, requiredJobsSuccessful, allJobsSuccessful, requiredArtifactsValid },
            };
          }
          const evidence = {
            schemaVersion: 'm2-r2-rebaseline-post-merge-observation/v1',
            releaseId: 'M2-RC1',
            version: '0.12.0',
            observedAt: new Date().toISOString(),
            target: { branch: 'main', sha: targetSha },
            runs,
            decision: {
              exactMainValidationVerified: verified.validation === true,
              portableReadinessVerified: verified.portableReadiness === true,
              historicalR2AAntiRegressionVerified: verified.historicalR2A === true,
              rebaselineAccepted: Object.values(verified).every((value) => value === true),
              repositoryReleaseReady: true,
              environmentPromotionEvaluated: false,
              environmentPromotionEligible: null,
              repositoryBlockers: [],
            },
            safetyBoundary: {
              secretAccessed: false,
              secretCreated: false,
              targetClusterAccessed: false,
              targetClusterModified: false,
              approvalCreated: false,
              rolloutExecuted: false,
              imagePublished: false,
              registryDigestChanged: false,
            },
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
      - name: Upload exact R2-Rebaseline post-merge observation
        uses: actions/upload-artifact@v4
        with:
          name: m2-r2-rebaseline-post-merge-observation
          path: /tmp/m2-r2-rebaseline-post-merge-observation.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce R2-Rebaseline post-merge gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile('/tmp/m2-r2-rebaseline-post-merge-observation.json', 'utf8'));
          if (evidence.target?.sha !== '70b06e28e48c38d8b7feed29177144d35cb96069'
              || evidence.decision?.exactMainValidationVerified !== true
              || evidence.decision?.portableReadinessVerified !== true
              || evidence.decision?.historicalR2AAntiRegressionVerified !== true
              || evidence.decision?.rebaselineAccepted !== true) {
            throw new Error('R2-Rebaseline post-merge verification is incomplete');
          }
          if (evidence.decision?.repositoryReleaseReady !== true
              || evidence.decision?.environmentPromotionEvaluated !== false
              || evidence.decision?.environmentPromotionEligible !== null
              || evidence.decision?.repositoryBlockers?.length !== 0) {
            throw new Error('Portable release readiness boundary changed');
          }
          if (Object.values(evidence.safetyBoundary ?? {}).some((value) => value !== false)) {
            throw new Error('Post-merge observation safety boundary changed');
          }
          NODE
