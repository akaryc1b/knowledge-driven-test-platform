name: m3-r3-g4-final-main-run-manifest

on:
  pull_request:
    paths:
      - '.github/workflows/m3-r3-g4-final-main-run-manifest.yml'
      - 'scripts/m3-r3-g4-final-main-run-manifest.js'
      - 'scripts/json-schema-draft-2020.js'
      - 'packages/k6-api-adapter/test/m3-r3-g4-final-main-run-manifest.test.js'
      - 'schemas/execution/k6-api-runtime/README.md'
      - 'schemas/execution/k6-api-runtime/v1/m3-r3-g4-final-main-run-manifest.schema.json'
      - 'docs/04-governance/m3-r3-g4-final-main-run-manifest.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-r3-g4-final-main-run-manifest.yml'
      - 'scripts/m3-r3-g4-final-main-run-manifest.js'
      - 'scripts/json-schema-draft-2020.js'
      - 'packages/k6-api-adapter/test/m3-r3-g4-final-main-run-manifest.test.js'
      - 'schemas/execution/k6-api-runtime/README.md'
      - 'schemas/execution/k6-api-runtime/v1/m3-r3-g4-final-main-run-manifest.schema.json'
      - 'docs/04-governance/m3-r3-g4-final-main-run-manifest.md'

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  M3_R3_G4_C2_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  M3_R3_G4_C2_BRANCH: ${{ github.head_ref || github.ref_name }}
  M3_R3_G4_C2_EVENT_NAME: ${{ github.event_name }}

jobs:
  validate-manifest-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact C2 state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact C2 Head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_G4_C2_EXACT_HEAD"
          test -z "$(git status --porcelain)"
          echo "checkedOutExactHead=$M3_R3_G4_C2_EXACT_HEAD"
      - name: Set up baseline Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run focused C2 tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            packages/k6-api-adapter/test/m3-r3-g4-final-main-run-manifest.test.js \
            > /tmp/m3-r3-g4-final-main-run-manifest-focused-node22.tap 2>&1
          printf 'M3_R3_G4_C2_FOCUSED_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Run complete root validation chain
        shell: bash
        run: |
          set -euo pipefail
          npm run validate \
            > /tmp/m3-r3-g4-final-main-run-manifest-root-validation.log 2>&1
          printf 'M3_R3_G4_C2_ROOT_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Run dedicated C2 repository Validator
        shell: bash
        run: |
          set -euo pipefail
          node scripts/m3-r3-g4-final-main-run-manifest.js \
            --validate-repository \
            > /tmp/m3-r3-g4-final-main-run-manifest-validator.log 2>&1
          printf 'M3_R3_G4_C2_VALIDATOR_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Generate pre-merge contract Evidence
        if: ${{ github.event_name == 'pull_request' }}
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/m3-r3-g4-final-main-run-manifest.js --emit-artifact)"
          echo "$result"
          digest="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).evidenceDigest)' "$result")"
          echo "evidence_digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_G4_C2_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - name: Upload permanent pre-merge contract Artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-r3-g4-final-main-run-manifest-evidence
          path: /tmp/m3-r3-g4-final-main-run-manifest-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  report-final-main-run-manifest:
    if: ${{ github.event_name == 'push' }}
    needs: validate-manifest-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out exact C2 main state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact C2 main Head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_G4_C2_EXACT_HEAD"
          test "$M3_R3_G4_C2_BRANCH" = 'main'
          test -z "$(git status --porcelain)"
      - name: Set up baseline Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Reproduce focused C2 acceptance log
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            packages/k6-api-adapter/test/m3-r3-g4-final-main-run-manifest.test.js \
            > /tmp/m3-r3-g4-final-main-run-manifest-focused-node22.tap 2>&1
          printf 'M3_R3_G4_C2_FOCUSED_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Reproduce complete root validation log
        shell: bash
        run: |
          set -euo pipefail
          npm run validate \
            > /tmp/m3-r3-g4-final-main-run-manifest-root-validation.log 2>&1
          printf 'M3_R3_G4_C2_ROOT_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Reproduce dedicated C2 Validator log
        shell: bash
        run: |
          set -euo pipefail
          node scripts/m3-r3-g4-final-main-run-manifest.js \
            --validate-repository \
            > /tmp/m3-r3-g4-final-main-run-manifest-validator.log 2>&1
          printf 'M3_R3_G4_C2_VALIDATOR_STATUS=success\n' >> "$GITHUB_ENV"
      - name: Generate complete exact-main Run Manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/m3-r3-g4-final-main-run-manifest.js --emit-artifact)"
          echo "$result"
          digest="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).evidenceDigest)' "$result")"
          expected="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).expectedWorkflowCount))' "$result")"
          exact_main="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).exactMainWorkflowCount))' "$result")"
          echo "evidence_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "expected_workflow_count=$expected" >> "$GITHUB_OUTPUT"
          echo "exact_main_workflow_count=$exact_main" >> "$GITHUB_OUTPUT"
      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_R3_G4_C2_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - name: Upload permanent exact-main Run Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-r3-g4-final-main-run-manifest-evidence
          path: /tmp/m3-r3-g4-final-main-run-manifest-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Append provisional exact-main Manifest identity
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id, per_page: 100,
            });
            const matches = artifacts.data.artifacts.filter(
              (item) => item.name === 'm3-r3-g4-final-main-run-manifest-evidence',
            );
            if (matches.length !== 1) {
              throw new Error(`Expected one C2 Artifact, found ${matches.length}`);
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id, filter: 'latest', per_page: 100,
            });
            const validation = jobs.data.jobs.filter(
              (item) => item.name === 'validate-manifest-contract',
            );
            const report = jobs.data.jobs.filter(
              (item) => item.name === 'report-final-main-run-manifest',
            );
            if (validation.length !== 1 || validation[0].conclusion !== 'success'
                || report.length !== 1 || report[0].status !== 'in_progress') {
              throw new Error('C2 Job self-observation is invalid');
            }
            const artifact = matches[0];
            const body = [
              '## Automated C2 exact-main Run Manifest self-report',
              '',
              '```text',
              `mergeSha=${context.sha}`,
              `runId=${run_id}`,
              `runAttempt=${process.env.GITHUB_RUN_ATTEMPT}`,
              `validationJobId=${validation[0].id}`,
              `validationJobConclusion=${validation[0].conclusion}`,
              `reportJobId=${report[0].id}`,
              `reportJobSelfObservedStatus=${report[0].status}`,
              `artifactId=${artifact.id}`,
              `artifactName=${artifact.name}`,
              `artifactApiDigest=${artifact.digest}`,
              `artifactSizeBytes=${artifact.size_in_bytes}`,
              `artifactExpired=${artifact.expired}`,
              `evidenceDigest=${{ steps.manifest.outputs.evidence_digest }}`,
              `expectedWorkflowCount=${{ steps.manifest.outputs.expected_workflow_count }}`,
              `exactMainWorkflowCount=${{ steps.manifest.outputs.exact_main_workflow_count }}`,
              'reportJobExternalVerificationRequired=true',
              'manualRerunPerformed=false',
              '```',
            ].join('\n');
            for (const issue_number of [75, 71]) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
